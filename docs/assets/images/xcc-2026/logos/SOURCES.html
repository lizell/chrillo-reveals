<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>reveal-md</title>
    <link rel="shortcut icon" href="./../../../../favicon.ico" />
    <link rel="stylesheet" href="./../../../../dist/reset.css" />
    <link rel="stylesheet" href="./../../../../dist/reveal.css" />
    <link rel="stylesheet" href="./../../../../dist/theme/black.css" id="theme" />
    <link rel="stylesheet" href="./../../../../css/highlight/base16/zenburn.css" />

    <link rel="stylesheet" href="./../../../../_assets/custom.css" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section data-markdown data-separator="^---$" data-separator-vertical="^--$">
          <textarea data-template>
            # Presentation logo sources

Downloaded 29 October 2026. Logos identify organisations Christian has worked with; they are not sponsor badges. Original geometry retained; Schibsted's white source is displayed in black using CSS for contrast. No collage crops or generated logos.

- SVT Nyheter: https://commons.wikimedia.org/wiki/File:SVT_Nyheter_2016.svg
- SVT Play: https://commons.wikimedia.org/wiki/File:SVT_Play_logotyp.svg — SVT, CC BY-SA 4.0 per source page; unchanged file.
- UR: black inline logo SVG from https://urplay.se/ (LoginBanner logo).
- Dagens Nyheter, Dagens industri, Expressen: original SVG assets from https://www.bonniernews.se/varumarken
- Svenska Dagbladet: https://commons.wikimedia.org/wiki/File:Svenska_Dagbladet_wordmark.svg
- Aftonbladet: https://cdn.aftonbladet.se/logotypes/v2/web/header/logo-aftonbladet-default.svg
- Schibsted: https://schibsted.com/wp-content/themes/scom/assets/img/Schibsted-logo-medium-white.svg
- Bonnier News: transparent PNG from https://www.bonniernews.se/press/pressmaterial

The Commons SVT and SvD source pages designate these simple logos as public-domain text logos. Brand rights remain with their owners.

          </textarea>
        </section>
      </div>
    </div>

    <script src="./../../../../dist/reveal.js"></script>

    <script src="./../../../../mermaid/dist/mermaid.min.js"></script>

    <script src="./../../../../plugin/markdown/markdown.js"></script>
    <script src="./../../../../plugin/highlight/highlight.js"></script>
    <script src="./../../../../plugin/zoom/zoom.js"></script>
    <script src="./../../../../plugin/notes/notes.js"></script>
    <script src="./../../../../plugin/math/math.js"></script>
    <script>
      function extend() {
        var target = {};
        for (var i = 0; i < arguments.length; i++) {
          var source = arguments[i];
          for (var key in source) {
            if (source.hasOwnProperty(key)) {
              target[key] = source[key];
            }
          }
        }
        return target;
      }

      // default options to init reveal.js
      var defaultOptions = {
        controls: true,
        progress: true,
        history: true,
        center: true,
        transition: 'default', // none/fade/slide/convex/concave/zoom
        slideNumber: true,
        highlight: {
          highlightOnLoad: false
        },
        plugins: [
          RevealMarkdown,
          RevealHighlight,
          RevealZoom,
          RevealNotes,
          RevealMath
        ]
      };

      // options from URL query string
      var queryOptions = Reveal().getQueryHash() || {};

      var options = extend(defaultOptions, {"transition":"slide","transitionSpeed":"default","controls":true,"controlsLayout":"edges","controlsTutorial":true,"controlsBackArrows":"visible","navigationMode":"default","progress":true,"hash":true,"slideNumber":"c/t","center":true,"width":1280,"height":720,"_":["slides/"],"static":"docs","static-dirs":"slides/assets","staticDirs":"slides/assets"}, queryOptions);
    </script>


    <script>
      Reveal.initialize(options);
      Reveal.addEventListener('ready', function (event) {
        const blocks = Reveal.getRevealElement().querySelectorAll('pre code:not(.mermaid)');
        const hlp = Reveal.getPlugin('highlight');
        blocks.forEach(hlp.highlightBlock);
      });
    </script>

    <script>
      const mermaidOptions = extend({ startOnLoad: false }, {});
      mermaid.startOnLoad = false;
      mermaid.initialize(mermaidOptions);
      const cb = function (event) {
        mermaid.init(mermaidOptions, '.stack.present > .present pre code.mermaid');
        mermaid.init(mermaidOptions, '.slides > .present:not(.stack) pre code.mermaid');
      }
      Reveal.addEventListener('ready', cb);
      Reveal.addEventListener('slidetransitionend', cb);
    </script>
  </body>
</html>
