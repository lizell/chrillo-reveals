<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">Förbättra setupen mellan försöken</title><desc id="desc">Prova en uppgift, hitta friktionen, ändra en sak och pröva igen. Behåll det som hjälper.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#c57337"/></marker></defs><g font-family="Avenir Next, Trebuchet MS, sans-serif"><text x="27" y="65" font-size="20" fill="#c57337" text-anchor="start" font-weight="600">01</text><rect x="15" y="90" width="235" height="150" rx="12" fill="#e7ece3" stroke="none" stroke-width="2"/><text x="132" y="144" font-size="26" fill="#173c37" text-anchor="middle" font-weight="600">Prova en uppgift</text><text x="132" y="190" font-size="17" fill="#526960" text-anchor="middle" font-weight="400">Mål + enkel setup</text><path d="M254 163 H295" fill="none" stroke="#c57337" stroke-width="3" marker-end="url(#arrow)"/><text x="312" y="65" font-size="20" fill="#c57337" text-anchor="start" font-weight="600">02</text><rect x="300" y="90" width="235" height="150" rx="12" fill="#e7ece3" stroke="none" stroke-width="2"/><text x="417" y="144" font-size="26" fill="#173c37" text-anchor="middle" font-weight="600">Hitta friktionen</text><text x="417" y="190" font-size="17" fill="#526960" text-anchor="middle" font-weight="400">Vad tog emot?</text><path d="M539 163 H580" fill="none" stroke="#c57337" stroke-width="3" marker-end="url(#arrow)"/><text x="597" y="65" font-size="20" fill="#c57337" text-anchor="start" font-weight="600">03</text><rect x="585" y="90" width="235" height="150" rx="12" fill="#173c37" stroke="none" stroke-width="2"/><text x="702" y="144" font-size="26" fill="#f6f3eb" text-anchor="middle" font-weight="600">Förbättra en sak</text><text x="702" y="190" font-size="17" fill="#d4e1d3" text-anchor="middle" font-weight="400">Kontext, test eller verktyg</text><path d="M824 163 H865" fill="none" stroke="#c57337" stroke-width="3" marker-end="url(#arrow)"/><text x="882" y="65" font-size="20" fill="#c57337" text-anchor="start" font-weight="600">04</text><rect x="870" y="90" width="235" height="150" rx="12" fill="#e7ece3" stroke="none" stroke-width="2"/><text x="987" y="144" font-size="26" fill="#173c37" text-anchor="middle" font-weight="600">Prova igen</text><text x="987" y="190" font-size="17" fill="#526960" text-anchor="middle" font-weight="400">Nästa liknande uppgift</text><path d="M986 246 V290 H132 V246" fill="none" stroke="#c57337" stroke-width="3" marker-end="url(#arrow)"/><text x="560" y="338" font-size="27" fill="#173c37" text-anchor="middle" font-weight="600">Behåll det som hjälper. Förenkla resten.</text></g></svg>