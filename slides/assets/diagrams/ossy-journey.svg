<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc"><title id="title">Ossys resa</title><desc id="desc">Handskriven prototyp, AI-kodning, tre omskrivningar och en publik produkt.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#c57337"/></marker></defs><g font-family="Avenir Next, Trebuchet MS, sans-serif"><path d="M45 115 H1075" fill="none" stroke="#c57337" stroke-width="3" marker-end="url(#arrow)"/><circle cx="55" cy="115" r="11" fill="#c57337"/><text x="55" y="78" font-size="19" fill="#526960" text-anchor="start" font-weight="400">01</text><text x="55" y="164" font-size="25" fill="#173c37" text-anchor="start" font-weight="650">Handskriven</text><text x="55" y="195" font-size="25" fill="#173c37" text-anchor="start" font-weight="650">prototyp</text><text x="55" y="239" font-size="21" fill="#526960" text-anchor="start" font-weight="400">Tekniksprint</text><text x="55" y="270" font-size="21" fill="#526960" text-anchor="start" font-weight="400">Idén från sporten</text><circle cx="335" cy="115" r="11" fill="#c57337"/><text x="335" y="78" font-size="19" fill="#526960" text-anchor="start" font-weight="400">02</text><text x="335" y="164" font-size="25" fill="#173c37" text-anchor="start" font-weight="650">AI börjar</text><text x="335" y="195" font-size="25" fill="#173c37" text-anchor="start" font-weight="650">koda</text><text x="335" y="239" font-size="21" fill="#526960" text-anchor="start" font-weight="400">Ett halvår senare</text><text x="335" y="270" font-size="21" fill="#526960" text-anchor="start" font-weight="400">Nytt försök</text><circle cx="615" cy="115" r="11" fill="#c57337"/><text x="615" y="78" font-size="19" fill="#526960" text-anchor="start" font-weight="400">03</text><text x="615" y="164" font-size="25" fill="#173c37" text-anchor="start" font-weight="650">Tre</text><text x="615" y="195" font-size="25" fill="#173c37" text-anchor="start" font-weight="650">omskrivningar</text><text x="615" y="239" font-size="21" fill="#526960" text-anchor="start" font-weight="400">Fredagar under hösten</text><text x="615" y="270" font-size="21" fill="#526960" text-anchor="start" font-weight="400">Processen tar form</text><circle cx="895" cy="115" r="11" fill="#c57337"/><text x="895" y="78" font-size="19" fill="#526960" text-anchor="start" font-weight="400">04</text><text x="895" y="164" font-size="25" fill="#173c37" text-anchor="start" font-weight="650">Publik</text><text x="895" y="195" font-size="25" fill="#173c37" text-anchor="start" font-weight="650">produkt</text><text x="895" y="239" font-size="21" fill="#526960" text-anchor="start" font-weight="400">En månad på heltid</text><text x="895" y="270" font-size="21" fill="#526960" text-anchor="start" font-weight="400">inför OS</text><path d="M850 322 H353" fill="none" stroke="#c57337" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="364" font-size="23" fill="#526960" text-anchor="middle" font-weight="400">Pröva · lära · ompröva</text></g></svg>